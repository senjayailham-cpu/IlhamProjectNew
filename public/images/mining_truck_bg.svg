<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="100%" height="100%">
  <defs>
    <!-- Sky & Atmosphere Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#144d75" />
      <stop offset="45%" stop-color="#2a7b9b" />
      <stop offset="70%" stop-color="#8d6885" />
      <stop offset="100%" stop-color="#e2878d" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffd5c2" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f28e85" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#144d75" stop-opacity="0" />
    </radialGradient>

    <!-- Truck Pink/Magenta Gradients -->
    <linearGradient id="pinkBodyGrad" x1="20%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f06292" />
      <stop offset="25%" stop-color="#d81b60" />
      <stop offset="70%" stop-color="#ad1457" />
      <stop offset="100%" stop-color="#880e4f" />
    </linearGradient>
    <linearGradient id="pinkHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff80ab" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c2185b" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="pinkRibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f48fb1" />
      <stop offset="50%" stop-color="#c2185b" />
      <stop offset="100%" stop-color="#6a0032" />
    </linearGradient>

    <!-- Industrial Yellow Gradients -->
    <linearGradient id="yellowCabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea00" />
      <stop offset="40%" stop-color="#ffc400" />
      <stop offset="80%" stop-color="#ff9100" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="yellowChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#b26a00" />
    </linearGradient>

    <!-- Tire & Rim Gradients -->
    <radialGradient id="tireGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2e39" />
      <stop offset="65%" stop-color="#181a20" />
      <stop offset="88%" stop-color="#0f1115" />
      <stop offset="97%" stop-color="#2c303c" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </radialGradient>
    <radialGradient id="rimGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffecb3" />
      <stop offset="35%" stop-color="#ffc107" />
      <stop offset="75%" stop-color="#ffa000" />
      <stop offset="100%" stop-color="#bf360c" />
    </radialGradient>

    <!-- Ground & Shadows -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d4e5a" />
      <stop offset="40%" stop-color="#2b3842" />
      <stop offset="100%" stop-color="#192229" />
    </linearGradient>
    <linearGradient id="workshopFloor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34495e" />
      <stop offset="60%" stop-color="#4a5f70" />
      <stop offset="100%" stop-color="#804e54" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="hexGrid" width="40" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 20 11.547 L 0 0 M 0 23.094 L 20 34.641 L 40 23.094 M 20 34.641 L 20 57.735 M 40 69.282 L 20 57.735 L 0 69.282" fill="none" stroke="#64b5f6" stroke-width="0.75" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- 1. SKY BACKGROUND -->
  <rect x="0" y="0" width="1600" height="960" fill="url(#skyGrad)" />
  <rect x="0" y="0" width="1600" height="960" fill="url(#sunGlow)" />
  <rect x="800" y="40" width="760" height="400" fill="url(#hexGrid)" opacity="0.6" />

  <!-- Technical Circuit Nodes in Sky -->
  <g stroke="#90caf9" stroke-width="1.2" stroke-opacity="0.35" fill="none">
    <circle cx="1450" cy="180" r="4" fill="#90caf9" fill-opacity="0.6" />
    <circle cx="1520" cy="180" r="3" fill="#90caf9" fill-opacity="0.4" />
    <path d="M 1380 240 L 1450 180 L 1550 180 L 1580 210" />
    <circle cx="1480" cy="270" r="3" fill="#90caf9" fill-opacity="0.5" />
    <path d="M 1480 270 L 1520 270 L 1550 300" />
    <!-- Left technical lines -->
    <path d="M 50 480 L 120 480 L 160 440 L 220 440" />
    <circle cx="160" cy="440" r="3" fill="#90caf9" fill-opacity="0.4" />
    <polygon points="80,450 95,441 110,450 110,468 95,477 80,468" stroke-width="0.8" />
    <polygon points="108,467 123,458 138,467 138,485 123,494 108,485" stroke-width="0.8" />
  </g>

  <!-- 2. INDUSTRIAL BACKGROUND (Workshop & Structures) -->
  <g opacity="0.45">
    <!-- Yard Wall / Workshop Bay -->
    <polygon points="0,520 380,490 380,720 0,720" fill="#1b2a38" />
    <polygon points="380,490 520,530 520,720 380,720" fill="#243442" />
    <!-- Distant Cranes & Overhead Beams -->
    <line x1="40" y1="520" x2="40" y2="280" stroke="#16222d" stroke-width="6" />
    <line x1="20" y1="290" x2="340" y2="290" stroke="#16222d" stroke-width="5" />
    <line x1="40" y1="360" x2="180" y2="290" stroke="#16222d" stroke-width="3" />
    <!-- Crane Boom on Right -->
    <line x1="1450" y1="340" x2="1450" y2="180" stroke="#ffd54f" stroke-width="4" stroke-opacity="0.7" />
    <line x1="1450" y1="180" x2="1490" y2="150" stroke="#ffd54f" stroke-width="3" stroke-opacity="0.7" />
    <line x1="1450" y1="180" x2="1410" y2="160" stroke="#ffd54f" stroke-width="3" stroke-opacity="0.7" />
    <!-- Workshop Building Right -->
    <polygon points="1440,380 1600,420 1600,760 1440,760" fill="#e0e6ed" fill-opacity="0.8" />
    <polygon points="1440,380 1470,390 1470,760 1440,760" fill="#cbd5e1" />
  </g>

  <!-- 3. WORKSHOP GROUND -->
  <polygon points="0,680 1600,640 1600,960 0,960" fill="url(#workshopFloor)" />
  <polygon points="0,730 1600,700 1600,960 0,960" fill="url(#groundGrad)" opacity="0.65" />

  <!-- Shadow Under Heavy Haul Truck -->
  <ellipse cx="680" cy="855" rx="550" ry="60" fill="#080b0f" opacity="0.7" filter="blur(10px)" />
  <ellipse cx="440" cy="860" rx="220" ry="40" fill="#05070a" opacity="0.8" />
  <ellipse cx="1180" cy="840" rx="200" ry="35" fill="#05070a" opacity="0.8" />

  <!-- Distant Equipment on Left -->
  <g opacity="0.4">
    <rect x="40" y="680" width="140" height="90" fill="#1e2c38" rx="6" />
    <line x1="60" y1="680" x2="80" y2="600" stroke="#d97706" stroke-width="6" />
    <line x1="80" y1="600" x2="160" y2="580" stroke="#d97706" stroke-width="5" />
    <circle cx="70" cy="770" r="16" fill="#111827" />
    <circle cx="150" cy="770" r="16" fill="#111827" />
  </g>

  <!-- ======================================================== -->
  <!-- 4. GIGANTIC MINING HAUL TRUCK (PINK BODY + YELLOW CHASSIS) -->
  <!-- ======================================================== -->
  <g id="miningTruckGroup">

    <!-- REAR WHEELS & AXLE (Behind Front Wheels) -->
    <g id="rearWheels">
      <!-- Shadow and tire rim background -->
      <circle cx="1240" cy="670" r="180" fill="url(#tireGrad)" />
      <!-- Tire Outer Rim & Treads -->
      <circle cx="1240" cy="670" r="170" fill="none" stroke="#252932" stroke-width="22" stroke-dasharray="24 10" />
      <circle cx="1240" cy="670" r="120" fill="none" stroke="#16181f" stroke-width="12" />
      <!-- Rear Yellow Wheel Hub -->
      <circle cx="1240" cy="670" r="85" fill="url(#rimGrad)" />
      <circle cx="1240" cy="670" r="60" fill="#e65100" />
      <circle cx="1240" cy="670" r="45" fill="url(#rimGrad)" />
      <circle cx="1240" cy="670" r="15" fill="#263238" />
    </g>

    <!-- TRUCK MAIN CHASSIS & HYDRAULIC SYSTEM -->
    <g id="chassisAndSuspension">
      <!-- Heavy Frame Beam Under Body -->
      <polygon points="460,540 1080,510 1140,620 490,630" fill="#263238" />
      <!-- Main Center Suspension Strut -->
      <rect x="710" y="520" width="45" height="170" rx="8" fill="#455a64" stroke="#1c252b" stroke-width="4" />
      <rect x="720" y="550" width="25" height="130" fill="#cfd8dc" opacity="0.85" />
      <!-- Hydraulic Hoist Cylinder (Connecting Frame to Pink Body) -->
      <polygon points="680,480 720,480 740,560 690,560" fill="#ffd54f" stroke="#ff8f00" stroke-width="3" />
      <polygon points="760,490 790,490 810,550 770,550" fill="#ffb300" />
      
      <!-- Central Yellow Equipment / Battery Box -->
      <polygon points="790,535 960,535 970,780 800,780" fill="url(#yellowCabGrad)" stroke="#b26a00" stroke-width="4" />
      <rect x="815" y="560" width="130" height="90" fill="#e65100" rx="4" opacity="0.25" />
      <line x1="820" y1="710" x2="940" y2="710" stroke="#b26a00" stroke-width="3" />
      <line x1="820" y1="730" x2="940" y2="730" stroke="#b26a00" stroke-width="3" />
    </g>

    <!-- TRUCK CABIN, RADIATOR & FRONT ASSEMBLY (YELLOW) -->
    <g id="yellowFrontAndCab">
      <!-- Lower Front Bumper Structure -->
      <polygon points="960,440 1440,380 1520,440 1420,740 1120,740 980,680" fill="url(#yellowChassis)" stroke="#b26a00" stroke-width="5" />
      
      <!-- Twin Radiator Grille Compartment -->
      <rect x="1090" y="300" width="180" height="100" rx="6" fill="#fbc02d" stroke="#e65100" stroke-width="4" />
      <!-- Left Grille Louvers -->
      <rect x="1105" y="315" width="65" height="70" fill="#212121" rx="4" />
      <line x1="1110" y1="330" x2="1165" y2="330" stroke="#424242" stroke-width="3" />
      <line x1="1110" y1="345" x2="1165" y2="345" stroke="#424242" stroke-width="3" />
      <line x1="1110" y1="360" x2="1165" y2="360" stroke="#424242" stroke-width="3" />
      <line x1="1110" y1="375" x2="1165" y2="375" stroke="#424242" stroke-width="3" />
      <!-- Right Grille Louvers -->
      <rect x="1190" y="315" width="65" height="70" fill="#212121" rx="4" />
      <line x1="1195" y1="330" x2="1250" y2="330" stroke="#424242" stroke-width="3" />
      <line x1="1195" y1="345" x2="1250" y2="345" stroke="#424242" stroke-width="3" />
      <line x1="1195" y1="360" x2="1250" y2="360" stroke="#424242" stroke-width="3" />
      <line x1="1195" y1="375" x2="1250" y2="375" stroke="#424242" stroke-width="3" />

      <!-- Dual Exhaust Pipes -->
      <path d="M 980 500 C 980 440, 1020 430, 1070 450" fill="none" stroke="#cfd8dc" stroke-width="26" stroke-linecap="round" />
      <circle cx="1070" cy="450" r="16" fill="#37474f" stroke="#b0bec5" stroke-width="5" />
      <path d="M 1030 520 C 1030 460, 1070 450, 1120 470" fill="none" stroke="#cfd8dc" stroke-width="24" stroke-linecap="round" />
      <circle cx="1120" cy="470" r="15" fill="#37474f" stroke="#b0bec5" stroke-width="5" />

      <!-- Walkway Platform & Safety Railings -->
      <polygon points="1060,400 1480,380 1480,420 1060,435" fill="#ffb300" stroke="#b26a00" stroke-width="2" />
      <line x1="1260" y1="380" x2="1260" y2="310" stroke="#ffb300" stroke-width="5" />
      <line x1="1340" y1="380" x2="1340" y2="310" stroke="#ffb300" stroke-width="5" />
      <line x1="1420" y1="380" x2="1420" y2="310" stroke="#ffb300" stroke-width="5" />
      <line x1="1250" y1="315" x2="1440" y2="315" stroke="#ffb300" stroke-width="5" />

      <!-- Access Diagonal Stairway / Ladder (Right Side) -->
      <g stroke="#ffb300" stroke-width="4">
        <line x1="1470" y1="410" x2="1530" y2="780" stroke-width="6" stroke="#b26a00" />
        <line x1="1495" y1="410" x2="1555" y2="780" stroke-width="6" stroke="#b26a00" />
        <line x1="1480" y1="470" x2="1510" y2="470" stroke-width="5" />
        <line x1="1490" y1="530" x2="1520" y2="530" stroke-width="5" />
        <line x1="1500" y1="590" x2="1530" y2="590" stroke-width="5" />
        <line x1="1510" y1="650" x2="1540" y2="650" stroke-width="5" />
        <line x1="1520" y1="710" x2="1550" y2="710" stroke-width="5" />
        <line x1="1530" y1="770" x2="1560" y2="770" stroke-width="5" />
      </g>

      <!-- Headlights and Indicators on Bumper -->
      <rect x="1380" y="405" width="28" height="18" rx="3" fill="#ffffff" stroke="#ff8f00" stroke-width="3" filter="drop-shadow(0 0 6px #fff)" />
      <rect x="1340" y="408" width="26" height="16" rx="3" fill="#ffffff" stroke="#ff8f00" stroke-width="3" />
      <circle cx="1420" cy="415" r="7" fill="#ff3d00" />
    </g>

    <!-- FRONT GIANT TIRE (Left/Foreground Side) -->
    <g id="frontLeftTire">
      <!-- Massive Black Haul Tire -->
      <circle cx="560" cy="690" r="225" fill="url(#tireGrad)" />
      
      <!-- Heavy Lug Treads Along Outer Circumference -->
      <circle cx="560" cy="690" r="215" fill="none" stroke="#2a2e37" stroke-width="26" stroke-dasharray="32 14" />
      <circle cx="560" cy="690" r="160" fill="none" stroke="#101216" stroke-width="18" />

      <!-- Yellow Haul Rim & Planetary Gear Cover -->
      <circle cx="560" cy="690" r="115" fill="url(#rimGrad)" stroke="#ff6f00" stroke-width="4" />
      <circle cx="560" cy="690" r="80" fill="#d84315" />
      <circle cx="560" cy="690" r="60" fill="url(#rimGrad)" />
      
      <!-- Planetary Ring Bolts Circle -->
      <circle cx="560" cy="690" r="72" fill="none" stroke="#ffe082" stroke-width="5" stroke-dasharray="6 14" />
      <circle cx="560" cy="690" r="25" fill="#212121" stroke="#ffb300" stroke-width="6" />
    </g>

    <!-- REAR OUTSIDE TIRE (Foreground Side) -->
    <g id="rearRightTire">
      <!-- Giant Haul Tire -->
      <circle cx="1180" cy="685" r="200" fill="url(#tireGrad)" />
      <circle cx="1180" cy="685" r="190" fill="none" stroke="#252932" stroke-width="24" stroke-dasharray="28 12" />
      <!-- Rim -->
      <circle cx="1180" cy="685" r="100" fill="url(#rimGrad)" stroke="#ff6f00" stroke-width="4" />
      <circle cx="1180" cy="685" r="68" fill="#d84315" />
      <circle cx="1180" cy="685" r="50" fill="url(#rimGrad)" />
      <circle cx="1180" cy="685" r="20" fill="#212121" stroke="#ffb300" stroke-width="5" />
    </g>

    <!-- ======================================================== -->
    <!-- 5. ICONIC PINK / MAGENTA DUMP BODY (HAUL TRAY & CANOPY) -->
    <!-- ======================================================== -->
    <g id="pinkDumpBody">
      <!-- Front Canopy Extension (Protecting Cab) Overhanging Top -->
      <polygon points="900,160 1440,55 1420,110 880,240" fill="#ff4081" stroke="#c2185b" stroke-width="5" />
      <!-- Under-Canopy Shadowed Gusset -->
      <polygon points="880,240 1420,110 1380,180 890,260" fill="#ad1457" />

      <!-- Main Pink Dump Body Tray Outer Shell -->
      <polygon points="70,300 890,140 1440,55 1380,190 980,265 920,490 800,535 480,540 70,390" fill="url(#pinkBodyGrad)" stroke="#880e4f" stroke-width="7" />

      <!-- Top Rim Reinforcement Lip (Vibrant Highlight) -->
      <polygon points="65,295 890,135 1440,50 1435,70 890,150 70,310" fill="url(#pinkHighlight)" />

      <!-- Sloped Rib 1 (Front/Canopy transition) -->
      <polygon points="880,140 980,265 920,490 890,480 945,275 860,155" fill="url(#pinkRibGrad)" stroke="#ad1457" stroke-width="2" />

      <!-- Sloped Rib 2 (Center-Front Bolster) -->
      <polygon points="670,175 750,290 730,510 700,500 720,300 645,190" fill="url(#pinkRibGrad)" stroke="#ad1457" stroke-width="2" />

      <!-- Sloped Rib 3 (Center Bolster) -->
      <polygon points="460,215 540,320 520,520 490,510 510,330 435,225" fill="url(#pinkRibGrad)" stroke="#ad1457" stroke-width="2" />

      <!-- Sloped Rib 4 (Rear Structural Bolster) -->
      <polygon points="260,255 330,350 310,480 280,470 300,360 235,265" fill="url(#pinkRibGrad)" stroke="#ad1457" stroke-width="2" />

      <!-- Diagonal Structural Webbing / Gusset Plates on Tray Side -->
      <polygon points="750,290 850,280 890,460 840,465" fill="#c2185b" opacity="0.6" />
      <polygon points="540,320 640,310 680,490 630,495" fill="#c2185b" opacity="0.6" />
      <polygon points="330,350 430,340 470,490 420,495" fill="#c2185b" opacity="0.6" />

      <!-- Rear Chute Angled Facet (Tapered Back of Tray) -->
      <polygon points="70,300 230,260 280,470 70,390" fill="#880e4f" />
      <polygon points="70,300 130,290 150,380 70,390" fill="#4a0020" />

      <!-- Specular Highlight Lines Along Bolster Ridges -->
      <line x1="880" y1="140" x2="980" y2="265" stroke="#ff80ab" stroke-width="3" stroke-linecap="round" />
      <line x1="670" y1="175" x2="750" y2="290" stroke="#ff80ab" stroke-width="3" stroke-linecap="round" />
      <line x1="460" y1="215" x2="540" y2="320" stroke="#ff80ab" stroke-width="3" stroke-linecap="round" />
      <line x1="260" y1="255" x2="330" y2="350" stroke="#ff80ab" stroke-width="3" stroke-linecap="round" />

      <!-- Distinctive Corner Accent on Dump Wing -->
      <polygon points="1350,150 1420,110 1380,190" fill="#f06292" opacity="0.8" />
    </g>

    <!-- Subtle Wheel Arch Mudflaps -->
    <path d="M 330 680 Q 320 780 300 810" stroke="#111827" stroke-width="14" stroke-linecap="square" fill="none" />
  </g>

  <!-- Atmospheric Sunlight Lens & Industrial Dust Particle Overlay -->
  <circle cx="1400" cy="120" r="160" fill="#ffffff" fill-opacity="0.12" filter="blur(30px)" />
  <circle cx="850" cy="200" r="280" fill="#ff4081" fill-opacity="0.08" filter="blur(40px)" />
</svg>
