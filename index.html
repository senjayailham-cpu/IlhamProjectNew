<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Austin Batam - Project Tracking Console</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (browser UI color saat app dibuka) -->
    <meta name="theme-color" content="#9b1c2e" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AB Console" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- MS/PWA color -->
    <meta name="msapplication-TileColor" content="#9b1c2e" />
    <script>
      // Early cross-origin and sandbox error filter
      (function() {
        var trap = function(msg) {
          if (!msg) return true;
          var msgStr = "";
          if (typeof msg === "object") {
            msgStr = String(msg.message || msg.reason || msg.description || JSON.stringify(msg) || "");
          } else {
            msgStr = String(msg);
          }
          var s = msgStr.toLowerCase();
          return s.includes("script error") || 
                 s.includes("websocket") || 
                 s.includes("failed to connect") || 
                 s.includes("connection") || 
                 s.includes("hmr") || 
                 s.includes("vite");
        };
        var origOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (trap(message) || trap(error) || !source) {
            console.warn("Trapped sandbox/external script error:", message, "from:", source);
            return true;
          }
          if (origOnError) return origOnError.apply(this, arguments);
          return false;
        };
        window.addEventListener("error", function(e) {
          if (trap(e.message) || trap(e.error) || !e.filename) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
        window.addEventListener("unhandledrejection", function(e) {
          if (trap(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
